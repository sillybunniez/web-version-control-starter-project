    <h1>Union Pacific 844</h1>
    <!-- Image of Union Pacific 844-->
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/57/Union_Pacific_844%2C_Painted_Rocks%2C_NV%2C_2009_%28crop%29.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="An Image of Union Pacific 844, a large black steam locomotive running with cylinder cocks open with black smoke pouring out of the smoke stack. Behind the Locomotive is the yellow water car, and a yellow tool car. The scene is set somewhere cloudy on a long big gray ballast rack with brown tan rocks scattered near it." class="img-fluid">
    <h2>The Living Legend</h2>
<p>Built in December of 1944, UP 844 is a 4-8-4 Northern type FEF-3 Steam Locomotive. Today the locomotive still runs for its namesake railroad for excursions.</p>
